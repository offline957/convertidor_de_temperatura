
<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Configuración del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Información de la página -->
    <meta
        name="description"
        content="Conversor de temperaturas entre Celsius, Fahrenheit y Kelvin."
    >

    <meta name="author" content="andres">

    <!-- Título y recursos -->
    <title>Conversor de Temperaturas</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="favicon.png" type="image/png">
</head>

<body>

    <!-- Contenedor principal de la aplicación -->
    <main class="caja" id="caja">

        <section class="elementos" aria-labelledby="titulo">

            <!-- Encabezado -->
            <header>
                <h1 id="titulo">Conversor de Temperaturas</h1>

                <p>
                    Introduce una temperatura para convertirla
                    automáticamente a las otras unidades.
                </p>
            </header>

            <!-- Formulario de conversión -->
            <form id="formulario-conversor">

                <!-- Celsius -->
                <div class="grupo-campo">
                    <label for="celsius">Celsius (°C)</label>

                    <input
                        id="celsius"
                        name="celcius"
                        step="any"
                        inputmode="decimal"
                        autocomplete="off"
                    >
                </div>

                <!-- Fahrenheit -->
                <div class="grupo-campo">
                    <label for="fahrenheit">Fahrenheit (°F)</label>

                    <input
                        id="fahrenheit"
                        name="fahrenheit"
                        step="any"
                        inputmode="decimal"
                        autocomplete="off"
                    >
                </div>

                <!-- Kelvin -->
                <div class="grupo-campo">
                    <label for="kelvin">Kelvin (K)</label>

                    <input
                        id="kelvin"
                        name="kelvin"
                        step="any"
                        inputmode="decimal"
                        autocomplete="off"
                    >
                </div>

            </form>

        </section>

    </main>

    <!-- Archivo JavaScript -->
    <script src="main.js" defer></script>

</body>
</html>
